name: Backtest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 1"

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy matplotlib

      - name: Run sample backtests
        run: |
          python scripts/run_backtest.py --strategy ma_cross --source sample
          cp reports/metrics.json /tmp/ma_cross_metrics.json
          python scripts/run_backtest.py --strategy momentum --source sample
          cp reports/metrics.json /tmp/momentum_metrics.json

      - name: Show metrics
        run: |
          echo "=== ma_cross ==="
          cat /tmp/ma_cross_metrics.json
          echo "=== momentum ==="
          cat /tmp/momentum_metrics.json

      - name: Upload report artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backtest-reports
          path: reports/
          retention-days: 14
